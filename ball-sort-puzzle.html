<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ball Sort Puzzle</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 50% 110%, rgba(120, 30, 10, 0.55) 0%, transparent 60%),
        radial-gradient(ellipse at 50% 0%,   rgba(20, 60, 120, 0.4) 0%, transparent 60%),
        linear-gradient(180deg, #0a0a1a 0%, #10102a 60%, #1a0808 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 24px 16px 32px;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #e8f4ff;
      overflow-x: hidden;
      user-select: none;
    }

    /* Starfield */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle, #fff 1px, transparent 1px),
        radial-gradient(circle, #fff 1px, transparent 1px),
        radial-gradient(circle, rgba(255,255,255,.6) 1px, transparent 1px),
        radial-gradient(circle, rgba(255,255,255,.4) 1px, transparent 1px);
      background-size: 400px 400px, 300px 300px, 500px 500px, 250px 250px;
      background-position: 0 0, 150px 200px, 70px 320px, 330px 80px;
      opacity: .25;
    }

    /* ── Header ── */
    h1 {
      font-size: clamp(1.4rem, 4vw, 2rem);
      font-weight: 800;
      letter-spacing: .04em;
      text-shadow: 0 0 30px rgba(100, 210, 255, .6);
      margin-bottom: 14px;
      text-align: center;
    }

    /* ── Stats bar ── */
    .stats {
      display: flex;
      gap: 32px;
      font-size: 1rem;
      margin-bottom: 24px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 999px;
      padding: 8px 28px;
    }
    .stats span strong { color: #7ef4ff; }

    /* ── Game area ── */
    .game-area {
      display: flex;
      gap: clamp(10px, 3vw, 24px);
      align-items: flex-end;
      margin-bottom: 28px;
      flex-wrap: wrap;
      justify-content: center;
    }

    /* ── Single tube column ── */
    .tube-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: transform .2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .tube-wrap:hover .tube { border-color: rgba(150,230,255,.7); }

    .tube-wrap.selected {
      transform: translateY(-18px);
      filter: drop-shadow(0 0 14px rgba(255,255,150,.7));
    }

    /* Rim */
    .tube-rim {
      width: clamp(58px, 9vw, 78px);
      height: 16px;
      background: linear-gradient(to bottom, #9af5ff 0%, #3abfd4 60%, #1a8fa0 100%);
      border-radius: 8px 8px 0 0;
      position: relative;
      box-shadow: 0 -4px 12px rgba(0,200,230,.5);
      z-index: 1;
    }
    .tube-wrap.selected .tube-rim {
      background: linear-gradient(to bottom, #ffffa0 0%, #ddcc00 60%, #aa9900 100%);
      box-shadow: 0 -4px 12px rgba(255,220,0,.6);
    }

    /* Glass tube body */
    .tube {
      width: clamp(58px, 9vw, 78px);
      height: var(--tube-h, 280px);
      position: relative;
      display: flex;
      flex-direction: column-reverse;
      align-items: center;
      padding: 4px 4px 8px;
      background:
        linear-gradient(to right,
          rgba(255,255,255,.22) 0%,
          rgba(255,255,255,.06) 18%,
          rgba(255,255,255,.02) 50%,
          rgba(255,255,255,.06) 82%,
          rgba(255,255,255,.20) 100%
        );
      border: 1.5px solid rgba(100,220,255,.45);
      border-top: none;
      border-radius: 0 0 999px 999px;
      box-shadow:
        inset 2px 0 8px rgba(255,255,255,.08),
        inset -2px 0 8px rgba(255,255,255,.05),
        0 8px 24px rgba(0,0,0,.5);
      overflow: hidden;
    }
    .tube-wrap.selected .tube {
      border-color: rgba(255,240,80,.6);
    }

    /* Inner glass gloss overlay */
    .tube::after {
      content: '';
      position: absolute;
      top: 0; left: 4px;
      width: 30%;
      height: 100%;
      background: linear-gradient(to right, rgba(255,255,255,.12), transparent);
      border-radius: 0 0 0 999px;
      pointer-events: none;
    }

    /* ── Balls ── */
    .ball {
      width: var(--ball-size, 62px);
      height: var(--ball-size, 62px);
      border-radius: 50%;
      flex-shrink: 0;
      position: relative;
      margin: 2px auto;
      transition: transform .15s ease;
    }
    /* Highlight spot */
    .ball::before {
      content: '';
      position: absolute;
      top: 16%;
      left: 22%;
      width: 28%;
      height: 20%;
      background: rgba(255,255,255,.55);
      border-radius: 50%;
      transform: rotate(-30deg);
    }
    /* Bottom shadow */
    .ball::after {
      content: '';
      position: absolute;
      bottom: 8%;
      left: 20%;
      width: 60%;
      height: 14%;
      background: rgba(0,0,0,.25);
      border-radius: 50%;
    }

    .ball.red {
      background: radial-gradient(circle at 38% 38%, #ff8f8f 0%, #d42020 50%, #6b0000 100%);
      box-shadow: 0 4px 18px rgba(200,30,30,.65), inset 0 -4px 10px rgba(0,0,0,.3);
    }
    .ball.green {
      background: radial-gradient(circle at 38% 38%, #8aff8a 0%, #22b54a 50%, #074d17 100%);
      box-shadow: 0 4px 18px rgba(30,180,70,.65), inset 0 -4px 10px rgba(0,0,0,.3);
    }
    .ball.blue {
      background: radial-gradient(circle at 38% 38%, #80c8ff 0%, #2272d4 50%, #041e60 100%);
      box-shadow: 0 4px 18px rgba(40,110,210,.65), inset 0 -4px 10px rgba(0,0,0,.3);
    }
    .ball.orange {
      background: radial-gradient(circle at 38% 38%, #ffe085 0%, #e07020 50%, #7a2a00 100%);
      box-shadow: 0 4px 18px rgba(220,120,20,.65), inset 0 -4px 10px rgba(0,0,0,.3);
    }

    /* Drop animation */
    @keyframes drop {
      0%   { transform: translateY(-30px); opacity: .5; }
      60%  { transform: translateY(4px); }
      80%  { transform: translateY(-3px); }
      100% { transform: translateY(0); opacity: 1; }
    }
    .ball.just-placed { animation: drop .3s ease forwards; }

    /* ── Controls ── */
    .controls {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      padding: 10px 26px;
      font-size: .95rem;
      font-weight: 700;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      transition: transform .15s, filter .15s, opacity .15s;
      letter-spacing: .03em;
    }
    button:hover:not(:disabled) { transform: scale(1.07); filter: brightness(1.15); }
    button:active:not(:disabled) { transform: scale(.97); }
    button:disabled { opacity: .35; cursor: not-allowed; }

    .btn-undo    { background: linear-gradient(135deg, #6c63ff, #a855f7); color: #fff; }
    .btn-restart { background: linear-gradient(135deg, #f5576c, #e4338a); color: #fff; }
    .btn-new     { background: linear-gradient(135deg, #11998e, #38ef7d); color: #fff; }
    .btn-hint    { background: linear-gradient(135deg, #f7971e, #ffd200); color: #1a1400; }

    /* ── Hint tube highlight ── */
    @keyframes pulseFrom {
      0%, 100% { filter: drop-shadow(0 0 6px rgba(255,210,0,.35)); }
      50%       { filter: drop-shadow(0 0 24px rgba(255,210,0,.95)); }
    }
    @keyframes pulseTo {
      0%, 100% { filter: drop-shadow(0 0 6px rgba(60,220,100,.35)); }
      50%       { filter: drop-shadow(0 0 24px rgba(60,220,100,.95)); }
    }
    .tube-wrap.hint-from { animation: pulseFrom 1s ease-in-out infinite; }
    .tube-wrap.hint-from .tube     { border-color: rgba(255,200,0,.85); }
    .tube-wrap.hint-from .tube-rim { background: linear-gradient(to bottom,#ffe04a,#c89800); box-shadow: 0 -4px 12px rgba(255,180,0,.55); }
    .tube-wrap.hint-to   { animation: pulseTo   1s ease-in-out infinite; }
    .tube-wrap.hint-to   .tube     { border-color: rgba(60,220,100,.85); }
    .tube-wrap.hint-to   .tube-rim { background: linear-gradient(to bottom,#80ffb4,#00aa52); box-shadow: 0 -4px 12px rgba(0,200,80,.55); }

    /* ── Toast ── */
    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-80px);
      background: rgba(20,20,40,.95);
      border: 1px solid rgba(100,220,255,.4);
      color: #e8f4ff;
      padding: 12px 28px;
      border-radius: 999px;
      font-size: 1rem;
      font-weight: 600;
      pointer-events: none;
      transition: transform .35s cubic-bezier(.2,.8,.4,1.2), opacity .35s;
      z-index: 200;
      white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    /* ── Win overlay ── */
    .win-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.72);
      align-items: center;
      justify-content: center;
      z-index: 300;
      backdrop-filter: blur(4px);
    }
    .win-overlay.show { display: flex; }

    .win-card {
      background: linear-gradient(145deg, #0d1232, #1a1040);
      border: 1.5px solid rgba(100,220,255,.4);
      border-radius: 24px;
      padding: 44px 52px;
      text-align: center;
      box-shadow: 0 0 60px rgba(100,180,255,.25), 0 20px 60px rgba(0,0,0,.5);
      animation: popIn .4s cubic-bezier(.2,.8,.4,1.2) both;
    }
    @keyframes popIn {
      from { transform: scale(.6); opacity: 0; }
      to   { transform: scale(1);  opacity: 1; }
    }
    .win-card .trophy { font-size: 3.5rem; display: block; margin-bottom: 12px; }
    .win-card h2 {
      font-size: 2rem;
      font-weight: 900;
      background: linear-gradient(135deg, #ffe44d, #3ddc84);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }
    .win-card p { font-size: 1.1rem; margin-bottom: 24px; color: #c8deff; }
    .win-card p strong { color: #7ef4ff; }

    /* ── Difficulty selector ── */
    .diff-row {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .diff-btn {
      padding: 6px 18px;
      font-size: .85rem;
      font-weight: 700;
      border: 1.5px solid rgba(255,255,255,.2);
      border-radius: 999px;
      background: rgba(255,255,255,.07);
      color: #c8deff;
      cursor: pointer;
      transition: all .15s;
    }
    .diff-btn:hover { background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.4); }
    .diff-btn.active {
      background: linear-gradient(135deg, rgba(110,90,255,.5), rgba(40,160,220,.5));
      border-color: rgba(120,210,255,.6);
      color: #fff;
    }
    /* Expert gets a fiery red/gold gradient to signal it's a different beast */
    .diff-btn.expert {
      border-color: rgba(255,140,0,.45);
      color: #ffd080;
    }
    .diff-btn.expert:hover {
      background: rgba(255,100,0,.18);
      border-color: rgba(255,160,40,.7);
    }
    .diff-btn.expert.active {
      background: linear-gradient(135deg, rgba(220,60,0,.6), rgba(200,120,0,.6));
      border-color: rgba(255,180,40,.8);
      color: #ffe4a0;
    }
  </style>
</head>
<body>

<h1>Can you solve this puzzle?</h1>

<div class="diff-row" id="diff-row">
  <button class="diff-btn active" data-diff="easy"   onclick="setDiff('easy')">Easy</button>
  <button class="diff-btn"        data-diff="medium" onclick="setDiff('medium')">Medium</button>
  <button class="diff-btn"        data-diff="hard"   onclick="setDiff('hard')">Hard</button>
  <button class="diff-btn expert" data-diff="expert" onclick="setDiff('expert')">Expert</button>
</div>

<div class="stats">
  <span>Moves: <strong id="move-count">0</strong></span>
  <span>Best: <strong id="best-moves">—</strong></span>
</div>

<div class="game-area" id="game-area"></div>

<div class="controls">
  <button class="btn-undo"    id="btn-undo"    onclick="undo()">↩ Undo</button>
  <button class="btn-hint"    id="btn-hint"    onclick="showHint()">💡 Hint</button>
  <button class="btn-restart"                  onclick="restart()">↺ Restart</button>
  <button class="btn-new"                      onclick="newGame()">✦ New Game</button>
</div>

<div class="toast" id="toast"></div>

<div class="win-overlay" id="win-overlay">
  <div class="win-card">
    <span class="trophy">🏆</span>
    <h2>Puzzle Solved!</h2>
    <p>Completed in <strong id="final-moves"></strong> moves!</p>
    <button class="btn-restart" onclick="restart(); closeWin()">Play Again</button>
  </div>
</div>

<script>
  // ─── Config by difficulty ────────────────────────────────────────────────
  const DIFFICULTIES = {
    easy: {
      colors: 4,
      tubeSize: 4,
      extraEmpty: 2,
      bestKey: 'bsp-best-easy',
    },
    medium: {
      colors: 5,
      tubeSize: 4,
      extraEmpty: 2,
      bestKey: 'bsp-best-medium',
    },
    hard: {
      colors: 6,
      tubeSize: 5,
      extraEmpty: 2,
      bestKey: 'bsp-best-hard',
    },
    expert: {
      colors: 7,
      tubeSize: 5,
      extraEmpty: 1,   // only ONE empty tube — the core difficulty spike
      bestKey: 'bsp-best-expert',
    },
  };

  const COLOR_LIST = ['red', 'green', 'blue', 'orange', 'purple', 'pink', 'teal'];

  const EXTRA_STYLES = `
    .ball.purple {
      background: radial-gradient(circle at 38% 38%, #d88aff 0%, #8b20d4 50%, #2e0060 100%);
      box-shadow: 0 4px 18px rgba(140,40,210,.65), inset 0 -4px 10px rgba(0,0,0,.3);
    }
    .ball.pink {
      background: radial-gradient(circle at 38% 38%, #ffb3d9 0%, #e02090 50%, #6b0040 100%);
      box-shadow: 0 4px 18px rgba(220,40,140,.65), inset 0 -4px 10px rgba(0,0,0,.3);
    }
    .ball.teal {
      background: radial-gradient(circle at 38% 38%, #80ffe8 0%, #00b894 50%, #004d40 100%);
      box-shadow: 0 4px 18px rgba(0,184,148,.65), inset 0 -4px 10px rgba(0,0,0,.3);
    }
  `;
  const styleEl = document.createElement('style');
  styleEl.textContent = EXTRA_STYLES;
  document.head.appendChild(styleEl);

  // ─── State ───────────────────────────────────────────────────────────────
  let diff = 'easy';
  let cfg = DIFFICULTIES[diff];
  let tubes = [];
  let initialTubes = [];
  let selected = null;
  let moves = 0;
  let history = [];       // stack of [tubes snapshot, selected]
  let justPlaced = null;  // tube index that just received a ball
  let hintMove   = null;  // { from, to } or null

  // ─── Difficulty ──────────────────────────────────────────────────────────
  function setDiff(d) {
    diff = d;
    cfg = DIFFICULTIES[d];
    document.querySelectorAll('.diff-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.diff === d);
    });
    newGame();
  }

  // ─── Layout: size balls and tube to fit all balls on screen ─────────────
  function updateLayout() {
    const vw = window.innerWidth;
    const vh = window.innerHeight;

    // Tube width mirrors CSS clamp(58px, 9vw, 78px)
    const tubeW = Math.max(58, Math.min(78, vw * 0.09));
    // Budget for tube height: 60% of viewport, max 340px
    const maxTubeH = Math.min(vh * 0.60, 340);

    // Ball must fit both horizontally inside the tube and
    // vertically so all tubeSize balls are visible
    const ballFromW = Math.floor(tubeW) - 10;                          // 5px side padding
    const ballFromH = Math.floor((maxTubeH - 16) / cfg.tubeSize) - 4; // 8px tube padding + 4px ball margin
    const ballSize  = Math.max(28, Math.min(ballFromW, ballFromH, 62));

    // Tube height snug-fits exactly tubeSize balls
    const tubeH = cfg.tubeSize * (ballSize + 4) + 16;

    document.documentElement.style.setProperty('--ball-size', ballSize + 'px');
    document.documentElement.style.setProperty('--tube-h',   tubeH  + 'px');
  }

  // ─── Puzzle generation ───────────────────────────────────────────────────
  function generatePuzzle() {
    const { colors, tubeSize, extraEmpty } = cfg;

    // Build a flat list of all balls and shuffle it randomly.
    // Valid game moves can only place same-colour on top, so shuffling
    // via valid moves from a sorted state can never interleave colours —
    // we must randomise the ball arrangement directly instead.
    const allBalls = [];
    for (let c = 0; c < colors; c++) {
      for (let b = 0; b < tubeSize; b++) allBalls.push(COLOR_LIST[c]);
    }
    for (let i = allBalls.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [allBalls[i], allBalls[j]] = [allBalls[j], allBalls[i]];
    }

    // Distribute into tubes (bottom-to-top order)
    const state = [];
    for (let t = 0; t < colors; t++) {
      state.push(allBalls.slice(t * tubeSize, (t + 1) * tubeSize));
    }
    for (let e = 0; e < extraEmpty; e++) state.push([]);

    // Reject trivially solved layouts (extremely rare but possible)
    if (isSolved(state, tubeSize, colors)) return generatePuzzle();

    // For expert mode (only 1 empty tube) run a fast bounded DFS to confirm
    // the puzzle is actually solvable before handing it to the player.
    if (extraEmpty === 1 && !isSolvable(state, tubeSize, colors)) {
      return generatePuzzle();
    }

    return state;
  }

  // Bounded DFS solver — returns true if the puzzle can be solved within
  // MAX_STATES visited states.  Fast enough for the 8-tube expert config.
  function isSolvable(initState, tubeSize, numColors) {
    const MAX_STATES = 80000;
    const visited = new Set();
    const stack = [initState.map(t => [...t])];
    let checked = 0;

    while (stack.length && checked < MAX_STATES) {
      const state = stack.pop();
      checked++;

      const key = state.map(t => t.join(',')).join('|');
      if (visited.has(key)) continue;
      visited.add(key);

      if (isSolved(state, tubeSize, numColors)) return true;

      // Generate successors — prefer moves that complete a colour group
      const moves = [];
      for (let f = 0; f < state.length; f++) {
        if (!state[f].length) continue;
        const topColor = state[f][state[f].length - 1];
        for (let t = 0; t < state.length; t++) {
          if (f === t || state[t].length >= tubeSize) continue;
          const destTop = state[t].length ? state[t][state[t].length - 1] : null;
          if (destTop === null || destTop === topColor) {
            // Heuristic priority: completing a full group goes first
            const priority = (state[t].length > 0 && destTop === topColor) ? 1 : 0;
            moves.push([f, t, priority]);
          }
        }
      }
      // Push lower-priority moves first so higher-priority are explored first
      moves.sort((a, b) => a[2] - b[2]);
      for (const [f, t] of moves) {
        const next = state.map(tube => [...tube]);
        const color = next[f][next[f].length - 1];
        while (next[f].length && next[f][next[f].length - 1] === color && next[t].length < tubeSize) {
          next[t].push(next[f].pop());
        }
        stack.push(next);
      }
    }
    return false;
  }

  function isSolved(state, tubeSize, numColors) {
    let sortedFull = 0;
    for (const tube of state) {
      if (tube.length === 0) continue;
      if (tube.length === tubeSize && tube.every(b => b === tube[0])) sortedFull++;
    }
    return sortedFull === numColors;
  }

  // ─── Game lifecycle ───────────────────────────────────────────────────────
  function newGame() {
    updateLayout();
    tubes = generatePuzzle();
    initialTubes = tubes.map(t => [...t]);
    selected  = null;
    moves     = 0;
    history   = [];
    justPlaced = null;
    hintMove   = null;
    render();
    updateStats();
  }

  function restart() {
    tubes = initialTubes.map(t => [...t]);
    selected  = null;
    moves     = 0;
    history   = [];
    justPlaced = null;
    hintMove   = null;
    render();
    updateStats();
  }

  function closeWin() {
    document.getElementById('win-overlay').classList.remove('show');
  }

  // ─── Game logic ───────────────────────────────────────────────────────────
  function topOf(idx) {
    return tubes[idx].length ? tubes[idx][tubes[idx].length - 1] : null;
  }

  function canMove(from, to) {
    if (from === to) return false;
    if (!tubes[from].length) return false;
    if (tubes[to].length >= cfg.tubeSize) return false;
    const dest = topOf(to);
    return dest === null || dest === topOf(from);
  }

  function doMove(from, to) {
    history.push({ tubes: tubes.map(t => [...t]), selected, moves });
    const color = topOf(from);
    while (topOf(from) === color && tubes[to].length < cfg.tubeSize) {
      tubes[to].push(tubes[from].pop());
    }
    moves++;
    justPlaced = to;
    hintMove   = null;
    selected   = null;
  }

  function clickTube(idx) {
    if (isSolved(tubes, cfg.tubeSize, cfg.colors)) return;

    if (selected === null) {
      if (!tubes[idx].length) return;
      // Don't allow selecting a tube that's already fully sorted
      const tube = tubes[idx];
      if (tube.length === cfg.tubeSize && tube.every(b => b === tube[0])) {
        showToast('Already sorted!');
        return;
      }
      selected = idx;
      render();
      return;
    }

    if (selected === idx) {
      selected = null;
      render();
      return;
    }

    if (canMove(selected, idx)) {
      doMove(selected, idx);
      render();
      updateStats();
      if (isSolved(tubes, cfg.tubeSize, cfg.colors)) {
        setTimeout(showWin, 450);
      }
    } else {
      // Try re-selecting
      if (tubes[idx].length) {
        const tube = tubes[idx];
        if (tube.length === cfg.tubeSize && tube.every(b => b === tube[0])) {
          showToast('Already sorted!');
          selected = null;
        } else {
          selected = idx;
        }
      } else {
        // Can't move here (full)
        if (tubes[idx].length >= cfg.tubeSize) {
          showToast('Tube is full!');
        }
        selected = null;
      }
      render();
    }
  }

  function undo() {
    if (!history.length) return;
    const snap = history.pop();
    tubes = snap.tubes;
    selected = snap.selected;
    moves = snap.moves;
    justPlaced = null;
    hintMove   = null;
    render();
    updateStats();
  }

  // ─── Hint ────────────────────────────────────────────────────────────────
  // Maps each colour name to a single-digit index for fast state-key hashing.
  const COLOR_IDX = Object.fromEntries(COLOR_LIST.map((c, i) => [c, i]));
  function stateKey(s) { return s.map(t => t.map(c => COLOR_IDX[c]).join('')).join('|'); }

  function showHint() {
    if (isSolved(tubes, cfg.tubeSize, cfg.colors)) return;
    // Toggle off if hint is already visible
    if (hintMove) { hintMove = null; render(); return; }

    const move = findBestMove(tubes, cfg.tubeSize, cfg.colors);
    if (!move) { showToast('No moves available!'); return; }
    hintMove = move;
    // Clear hint automatically after the player watches it for a bit
    render();
  }

  // BFS that returns the *first move* of a shortest solution path.
  // Falls back to a one-step heuristic when the state space is too large.
  function findBestMove(initState, tubeSize, numColors) {
    const MAX_NODES = 20000;
    const startKey = stateKey(initState);

    // parent[childKey] = { parentKey, move } for path reconstruction
    const parent = new Map();
    parent.set(startKey, { parentKey: null, move: null });

    const queue = [initState.map(t => [...t])];
    let head = 0;

    while (head < queue.length && parent.size < MAX_NODES) {
      const cur = queue[head++];
      const curKey = stateKey(cur);

      if (isSolved(cur, tubeSize, numColors)) {
        // Walk back up the parent chain to find the move taken from the start
        let k = curKey;
        while (parent.get(k).parentKey !== startKey) k = parent.get(k).parentKey;
        return parent.get(k).move;
      }

      for (let f = 0; f < cur.length; f++) {
        if (!cur[f].length) continue;
        // Never move from an already-completed tube
        if (cur[f].length === tubeSize && cur[f].every(b => b === cur[f][0])) continue;

        const topColor = cur[f][cur[f].length - 1];
        for (let t = 0; t < cur.length; t++) {
          if (f === t || cur[t].length >= tubeSize) continue;
          const destTop = cur[t].length ? cur[t][cur[t].length - 1] : null;
          if (destTop !== null && destTop !== topColor) continue;

          const next = cur.map(tube => [...tube]);
          const col  = next[f][next[f].length - 1];
          while (next[f].length && next[f][next[f].length - 1] === col && next[t].length < tubeSize) {
            next[t].push(next[f].pop());
          }
          const nk = stateKey(next);
          if (!parent.has(nk)) {
            parent.set(nk, { parentKey: curKey, move: { from: f, to: t } });
            queue.push(next);
          }
        }
      }
    }

    // BFS hit the node limit — use a scored one-step heuristic instead
    return bestHeuristicMove(initState, tubeSize, numColors);
  }

  // Scores every legal move and returns the highest-scoring one.
  function bestHeuristicMove(state, tubeSize, numColors) {
    let best = null, bestScore = -Infinity;

    for (let f = 0; f < state.length; f++) {
      if (!state[f].length) continue;
      if (state[f].length === tubeSize && state[f].every(b => b === state[f][0])) continue;

      const topColor = state[f][state[f].length - 1];
      for (let t = 0; t < state.length; t++) {
        if (f === t || state[t].length >= tubeSize) continue;
        const destTop = state[t].length ? state[t][state[t].length - 1] : null;
        if (destTop !== null && destTop !== topColor) continue;

        // Simulate move
        const nx = state.map(tube => [...tube]);
        let moved = 0;
        while (nx[f].length && nx[f][nx[f].length - 1] === topColor && nx[t].length < tubeSize) {
          nx[t].push(nx[f].pop()); moved++;
        }

        let score = 0;
        // Completing a tube is always the best possible move
        if (nx[t].length === tubeSize && nx[t].every(b => b === nx[t][0])) score += 10000;
        // Stacking onto an existing same-colour group is good progress
        if (state[t].length > 0) score += 200;
        // Emptying a tube creates a free slot (very valuable)
        if (nx[f].length === 0) score += 600;
        // Moving to an empty tube costs freedom (penalise)
        if (state[t].length === 0) score -= 80;
        // Moving a bigger group in one go is efficient
        score += moved * 25;
        // Bonus if the ball now uncovered in the source tube can immediately
        // move somewhere useful (look one step ahead)
        if (nx[f].length > 0) {
          const under = nx[f][nx[f].length - 1];
          for (let t2 = 0; t2 < nx.length; t2++) {
            if (t2 === f || nx[t2].length >= tubeSize) continue;
            const t2top = nx[t2].length ? nx[t2][nx[t2].length - 1] : null;
            if (t2top === under) { score += 150; break; }
          }
        }

        if (score > bestScore) { bestScore = score; best = { from: f, to: t }; }
      }
    }
    return best;
  }

  // ─── Render ───────────────────────────────────────────────────────────────
  function render() {
    const area = document.getElementById('game-area');
    area.innerHTML = '';

    tubes.forEach((tube, idx) => {
      const wrap = document.createElement('div');
      let cls = 'tube-wrap';
      if (selected  === idx)              cls += ' selected';
      if (hintMove?.from === idx)         cls += ' hint-from';
      if (hintMove?.to   === idx)         cls += ' hint-to';
      wrap.className = cls;
      wrap.onclick = () => clickTube(idx);

      const rim = document.createElement('div');
      rim.className = 'tube-rim';

      const body = document.createElement('div');
      body.className = 'tube';

      tube.forEach((color, ballIdx) => {
        const ball = document.createElement('div');
        const isNew = justPlaced === idx && ballIdx >= tube.length - countTopSame(tube);
        ball.className = 'ball ' + color + (isNew ? ' just-placed' : '');
        body.appendChild(ball);
      });

      wrap.appendChild(rim);
      wrap.appendChild(body);
      area.appendChild(wrap);
    });

    document.getElementById('btn-undo').disabled = !history.length;
    document.getElementById('btn-hint').disabled = isSolved(tubes, cfg.tubeSize, cfg.colors);
    justPlaced = null;
  }

  function countTopSame(tube) {
    if (!tube.length) return 0;
    const top = tube[tube.length - 1];
    let count = 0;
    for (let i = tube.length - 1; i >= 0 && tube[i] === top; i--) count++;
    return count;
  }

  // ─── Stats ────────────────────────────────────────────────────────────────
  function updateStats() {
    document.getElementById('move-count').textContent = moves;
    const best = localStorage.getItem(cfg.bestKey);
    document.getElementById('best-moves').textContent = best ?? '—';
  }

  function showWin() {
    const best = localStorage.getItem(cfg.bestKey);
    if (!best || moves < parseInt(best)) {
      localStorage.setItem(cfg.bestKey, moves);
    }
    document.getElementById('final-moves').textContent = moves;
    document.getElementById('win-overlay').classList.add('show');
    updateStats();
  }

  // ─── Toast ────────────────────────────────────────────────────────────────
  let toastTimer;
  function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 1600);
  }

  // ─── Keyboard support ─────────────────────────────────────────────────────
  document.addEventListener('keydown', e => {
    if (e.key === 'z' || e.key === 'Z') undo();
    if (e.key === 'r' || e.key === 'R') restart();
    if (e.key === 'Escape') { selected = null; render(); }
    const n = parseInt(e.key);
    if (n >= 1 && n <= tubes.length) clickTube(n - 1);
  });

  // ─── Boot ─────────────────────────────────────────────────────────────────
  window.addEventListener('resize', () => { updateLayout(); render(); });
  newGame();
</script>
</body>
</html>
